<div class="flex gap-2 flex-col">
  <div class="delimiter"></div>
  <nav class="content-gutter-wide" id="breadcrumbNav" #breadcrumbNav>
    <div
      class="flex gap-2 text-sm"
      itemscope
      itemtype="https://schema.org/BreadcrumbList"
    >
      @for (
        segment of segments;
        track segment.name;
        let i = $index, last = $last
      ) {
        <div
          class="flex items-center gap-2 whitespace-nowrap"
          [class.shrink-0]="!last"
          [class.min-w-0]="last"
        >
          @if (i > 0) {
            <div class="text-emerald-400">/</div>
          }
          <div
            class="breadcrumb-item"
            [class.min-w-0]="last"
            itemprop="itemListElement"
            itemscope
            itemtype="https://schema.org/ListItem"
          >
            @if (segment.url) {
              <a
                itemprop="item"
                routerLink="{{ segment.url }}"
                [queryParams]="segment.queryParams"
                class="flex min-h-6 min-w-0 items-center text-white hover:text-emerald-400"
              >
                <span itemprop="name" class="truncate">{{ segment.name }}</span>
              </a>
            } @else {
              <span
                itemprop="item"
                class="flex min-h-6 min-w-0 items-center text-white"
              >
                <span itemprop="name" class="truncate">{{ segment.name }}</span>
              </span>
            }
            <meta itemprop="position" content="{{ i + 1 }}" />
          </div>
        </div>
      }
    </div>
  </nav>
  <div class="delimiter"></div>
</div>
