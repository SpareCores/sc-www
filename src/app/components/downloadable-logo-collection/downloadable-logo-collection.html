<div
  class="flex flex-col w-full max-w-xs md:max-w-71 h-full bg-white border border-emerald-400 shadow-2xs rounded-xl"
>
  <div
    class="w-full h-32 rounded-t-xl flex items-center justify-center bg-conic-[at_bottom] from-neutral-100 via-neutral-500 to-stone-900"
  >
    <div class="relative max-h-20 max-w-[80%] h-20 w-full">
      @if (folderName && fileNames.length) {
        <img
          [ngSrc]="previewSrc"
          [alt]="folderName || 'Logo'"
          fill
          class="object-contain"
          sizes="(max-width: 768px) 80vw, 20vw"
        />
      }
    </div>
  </div>

  <div class="p-4 md:p-5 space-y-3 flex-1 w-full flex flex-col justify-between">
    <div>
      <h3 class="text-lg font-bold text-gray-900">
        {{ folderName }}
      </h3>
    </div>
    <div class="mt-auto w-full flex flex-col gap-2 relative">
      <sc-button
        class="w-full min-w-0"
        label="Downloadable versions"
        icon="chevron-down"
        variant="dropdown"
        [id]="downloadsToggleId"
        [ariaExpanded]="isOpen"
        [ariaControls]="downloadsDropdownId"
        (click)="onToggleClick()"
      ></sc-button>

      @if (isOpen) {
        <div
          [id]="downloadsDropdownId"
          class="absolute left-0 right-0 top-full z-20 mt-2 w-full sc-dropdown"
          [attr.aria-labelledby]="downloadsToggleId"
        >
          <ul class="sc-dropdown__list">
            @for (
              downloadItem of downloadItems;
              track trackByFile($index, downloadItem)
            ) {
              <li>
                <a
                  class="sc-dropdown__option w-full text-white no-underline"
                  [href]="downloadItem.href"
                  [attr.download]="downloadItem.downloadName"
                  (click)="onDownloadClick($event, downloadItem)"
                >
                  {{ downloadItem.file }}
                </a>
              </li>
            }
          </ul>
        </div>
      }
    </div>
  </div>
</div>
