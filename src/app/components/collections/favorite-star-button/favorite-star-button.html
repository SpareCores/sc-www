<button
  type="button"
  class="favorite-star-button"
  [class.favorite-star-button--active]="isFavorite()"
  [disabled]="disabled() || isLoading()"
  [attr.aria-label]="
    isFavorite() ? 'Remove from favorites' : 'Add to favorites'
  "
  [attr.aria-pressed]="isFavorite()"
  (click)="toggle($event)"
>
  <svg lucideStar class="favorite-star-button__icon"></svg>
</button>
