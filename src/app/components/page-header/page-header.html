<div class="page-header" [class.page-header--actions-from-sm]="actionsFromSm()">
  <div class="page-header__bar">
    <div class="page-header__heading">
      @if (icon()) {
        <svg
          [lucideIcon]="icon()"
          class="page-header__icon"
          aria-hidden="true"
        ></svg>
      }
      <h1 class="page-header__title">{{ title() }}</h1>
      @if (showEdit()) {
        <button
          type="button"
          class="page-header__edit"
          [attr.aria-label]="editAriaLabel()"
          (click)="editClick.emit($event)"
        >
          <svg lucideSquarePen class="page-header__edit-icon"></svg>
        </button>
      }
    </div>
    @if (showBookmark()) {
      <sc-page-bookmark
        class="page-header__bookmark-wrap"
        [active]="bookmarkActive()"
        [disabled]="bookmarkDisabled()"
        [loading]="bookmarkLoading()"
        [guestLocked]="bookmarkGuestLocked()"
        (bookmarkClick)="bookmarkClick.emit($event)"
      ></sc-page-bookmark>
    }
    <div class="page-header__actions">
      <ng-content></ng-content>
      @if (showShare()) {
        <sc-share-link-button
          [buttonId]="shareButtonId()"
        ></sc-share-link-button>
      }
    </div>
  </div>
  <div class="page-header__description">
    <ng-content select="[pageHeaderDescription]"></ng-content>
  </div>
  <div class="page-header__toolbar">
    <ng-content select="[pageHeaderToolbar]"></ng-content>
  </div>
</div>
