<sc-button
  icon="minus"
  size="small"
  buttonClass="sc-button--group-start touch-none select-none"
  [ariaLabel]="'Decrease ' + label()"
  [ariaControls]="inputId()"
  [disabled]="!canDecrement()"
  data-ph-capture-attribute-number-stepper-action="decrement"
  (pointerdown)="startRepeat(-1, $event)"
  (pointerup)="stopRepeat()"
  (pointerleave)="stopRepeat()"
  (pointercancel)="stopRepeat()"
  (buttonClick)="onKeyboardClick(-1, $event)"
></sc-button>
<div class="relative">
  <input
    type="text"
    inputmode="numeric"
    autocomplete="off"
    scNumbersOnly
    [allowDecimal]="false"
    class="h-full rounded-none border-x-0 border-y-emerald-400 bg-gray-200 py-2 pl-2 pr-8 text-right text-sm text-black"
    [style.width]="inputWidth()"
    [attr.maxlength]="maxDigits()"
    [id]="inputId()"
    [value]="value()"
    [attr.aria-label]="label()"
    (input)="onInput($event)"
    (blur)="commit($event)"
    (keydown.enter)="commit($event)"
  />
  <span
    class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-sm text-gray-600"
    aria-hidden="true"
    >{{ unit() }}</span
  >
</div>
<sc-button
  icon="plus"
  size="small"
  buttonClass="sc-button--group-end touch-none select-none"
  [ariaLabel]="'Increase ' + label()"
  [ariaControls]="inputId()"
  [disabled]="!canIncrement()"
  data-ph-capture-attribute-number-stepper-action="increment"
  (pointerdown)="startRepeat(1, $event)"
  (pointerup)="stopRepeat()"
  (pointerleave)="stopRepeat()"
  (pointercancel)="stopRepeat()"
  (buttonClick)="onKeyboardClick(1, $event)"
></sc-button>
