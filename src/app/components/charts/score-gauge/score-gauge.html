@if (isBrowser) {
  <div class="score-gauge__canvas">
    <canvas
      baseChart
      [data]="data()"
      [options]="options"
      type="doughnut"
    ></canvas>
    <div class="score-gauge__value">
      <span class="score-gauge__number">{{ displayValue() }}</span>
    </div>
  </div>
} @else {
  <div class="score-gauge__fallback">
    <span class="score-gauge__number">{{ displayValue() }}</span>
  </div>
}
<div class="score-gauge__label">({{ label() }})</div>
