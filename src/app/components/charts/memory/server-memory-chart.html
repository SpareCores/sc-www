@if (chartData() && currentMemoryChartOption()) {
  <div class="chart-block--half" id="bw_mem_chart">
    <div
      class="flex flex-col items-start gap-4 md:flex-row md:items-center md:justify-between"
    >
      <h3 class="text-2xl flex items-center gap-2">
        <svg [lucideIcon]="'bwmem' | benchmarkIcon" class="h-6 w-6"></svg>
        <span class="whitespace-nowrap">Memory Bandwidth</span>
        <svg
          [lucideIcon]="currentMemoryChartIcon()"
          class="h-4 w-4 text-gray-200"
          (mouseenter)="showTooltip($event, currentMemoryChartOrderTooltip())"
          (mouseleave)="hideTooltip()"
        ></svg>
        <svg
          lucideInfo
          class="h-4 w-4 text-gray-200"
          (mouseenter)="showTooltip($event, currentMemoryChartInfo())"
          (mouseleave)="hideTooltip()"
        ></svg>
        @if (currentMemoryChartNote()) {
          <svg
            lucideTriangleAlert
            class="benchmark-note-icon"
            (mouseenter)="showWarningTooltip($event, currentMemoryChartNote())"
            (mouseleave)="hideTooltip()"
          ></svg>
        }
      </h3>
      <sc-button
        #memoryDropdown="scDropdown"
        [id]="buttonId"
        [scDropdown]="memoryPanel"
        [dropdownEnabled]="availableMemoryChartOptions().length > 0"
        [label]="currentMemoryChartOption().name"
        icon="chevron-down"
        variant="dropdown"
        size="small"
      ></sc-button>
    </div>
    @if (isBrowser) {
      <div class="h-full">
        <div class="chart_div" chartType="bar">
          <canvas
            id="bw_mem_canvas"
            baseChart
            [data]="chartData()"
            [options]="chartOptions()"
            [type]="lineChartType"
          >
          </canvas>
        </div>
      </div>
    }
  </div>

  <ng-template #memoryPanel>
    <div
      [id]="optionsId"
      class="w-max min-w-64 max-w-[calc(100vw-2rem)] sc-dropdown"
    >
      <ul class="sc-dropdown__list" [attr.aria-labelledby]="buttonId">
        @for (
          memoryOption of availableMemoryChartOptions();
          track memoryOption.id
        ) {
          <li>
            <button
              type="button"
              class="sc-dropdown__option"
              (click)="selectMemoryChartOption(memoryOption)"
              [title]="memoryOption.name"
            >
              <div class="text-white text-sm">{{ memoryOption.name }}</div>
            </button>
          </li>
        }
      </ul>
    </div>
  </ng-template>

  <div
    id="tooltipDefault"
    #tooltipDefault
    class="tooltip-panel fixed z-100 pointer-events-none opacity-0 hidden"
  >
    {{ tooltipContent() }}
  </div>
}
