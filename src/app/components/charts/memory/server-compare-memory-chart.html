<div
  class="chart-block--inline"
  [class.memory-compare-chart--cache-markers]="hasCacheAnnotations()"
>
  <div class="flex justify-end items-center">
    <sc-button
      #memoryCompareDropdown="scDropdown"
      [id]="buttonId"
      [scDropdown]="memoryComparePanel"
      [dropdownEnabled]="availableOptions().length > 0"
      [label]="currentOptionName()"
      icon="chevron-down"
      variant="dropdown"
    ></sc-button>
  </div>
  @if (chartData() && isBrowser) {
    <div class="h-full">
      <div class="chart_div" chartType="bar">
        <canvas
          baseChart
          [data]="chartData()"
          [options]="chartOptions()"
          [type]="lineChartType"
        >
        </canvas>
      </div>
    </div>
  }
</div>

<ng-template #memoryComparePanel>
  <div
    [id]="optionsId"
    class="w-max min-w-64 max-w-[calc(100vw-2rem)] sc-dropdown"
  >
    <ul class="sc-dropdown__list" [attr.aria-labelledby]="buttonId">
      @for (
        bwMemOperation of availableOptions();
        track bwMemOperation.id;
        let i = $index
      ) {
        <li>
          <button
            type="button"
            class="sc-dropdown__option"
            (click)="selectMemoryChartOption(i)"
            [title]="bwMemOperation.name"
          >
            <div class="text-white text-sm">{{ bwMemOperation.name }}</div>
          </button>
        </li>
      }
    </ul>
  </div>
</ng-template>
