<ng-template #modalTemplate>
  <sc-modal [id]="modalId()" [title]="title()" size="lg">
    <div class="p-4 flex flex-col gap-4">
      <label class="flex flex-col gap-2 text-white text-sm">
        <span>{{ nameLabel() }} *</span>
        <input
          #nameInput
          type="text"
          class="sc-input"
          [class.border-red-500]="showNameWarning()"
          [ngModel]="name()"
          (ngModelChange)="onNameChange($event)"
          (keydown.enter)="onNameEnter($event)"
          [minlength]="nameMinLength"
          maxlength="120"
          [attr.aria-invalid]="showNameWarning() ? true : null"
        />
        @if (showNameWarning()) {
          <span class="text-xs text-red-400">
            Name must be at least {{ nameMinLength }} characters.
          </span>
        }
      </label>
      <label class="flex flex-col gap-2 text-white text-sm">
        <span>{{ notesLabel() }}</span>
        <textarea
          rows="5"
          class="sc-input"
          [ngModel]="note()"
          (ngModelChange)="note.set($event)"
          [maxlength]="noteMaxLength"
        ></textarea>
        <span class="text-xs text-gray-400">
          {{ note().length }}/{{ noteMaxLength }}
        </span>
      </label>
    </div>
    <div modalFooter class="flex justify-end gap-3 p-4">
      <sc-button
        label="Cancel"
        variant="outline"
        color="brand"
        (buttonClick)="close()"
      ></sc-button>
      <sc-button
        [label]="confirmLabel()"
        icon="circle-check"
        [loading]="saving()"
        [disabled]="!canConfirm()"
        (buttonClick)="confirm()"
      ></sc-button>
    </div>
  </sc-modal>
</ng-template>
