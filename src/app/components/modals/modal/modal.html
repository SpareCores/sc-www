<div
  class="flex h-dvh w-screen flex-col overflow-hidden bg-secondary shadow-sm sm:h-auto sm:w-[calc(100vw-2rem)] sm:max-h-[calc(100dvh-2rem)] sm:has-data-modal-fill:h-[calc(100dvh-2rem)] sm:rounded-lg sm:border sm:border-solid sm:border-emerald-400"
  [class]="sizeClass()"
>
  <div
    class="relative flex gap-4 p-4 border-b border-gray-600"
    [class.items-center]="!!modalTitle()"
    [class.items-start]="!modalTitle()"
    [class.justify-between]="!centerTitle()"
    [class.justify-center]="centerTitle()"
  >
    <div
      class="min-w-0"
      [class.px-10]="centerTitle()"
      [class.text-center]="centerTitle()"
      [attr.id]="titleId"
    >
      @if (modalTitle()) {
        <h2 class="text-xl font-medium text-white">{{ modalTitle() }}</h2>
      }
      <ng-content select="[modalHeader]"></ng-content>
    </div>
    @if (showClose()) {
      <sc-button
        [class.absolute]="centerTitle()"
        [class.right-4]="centerTitle()"
        variant="close"
        icon="x"
        buttonClass="sc-button--dialog"
        [ariaLabel]="closeLabel()"
        [disabled]="closeDisabled()"
        [attr.data-ph-capture-attribute-sc-event]="closeCaptureEvent()"
        [attr.data-ph-capture-attribute-server-listing-search-prompt-action]="
          closeCaptureAction()
        "
        (buttonClick)="close()"
      ></sc-button>
    }
  </div>
  <div
    class="flex min-h-0 flex-1 flex-col bg-primary pb-[env(safe-area-inset-bottom)] has-[+div:not(:empty)]:pb-0 sm:flex-row sm:pb-0"
  >
    <div
      class="shrink-0 overflow-y-auto border-b border-gray-600 empty:hidden sm:border-b-0"
    >
      <ng-content select="[modalSidebar]"></ng-content>
    </div>
    <div class="flex min-h-0 min-w-0 flex-1 flex-col overflow-y-auto">
      <ng-content></ng-content>
    </div>
  </div>
  <div
    class="bg-secondary border-t border-gray-600 pb-[env(safe-area-inset-bottom)] empty:hidden sm:pb-0"
  >
    <ng-content select="[modalFooter]"></ng-content>
  </div>
</div>
