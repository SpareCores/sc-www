@if (badge()) {
  <div
    class="absolute -top-13.5 left-1/2 flex size-27 -translate-x-1/2 items-center justify-center rounded-full bg-emerald-400 sm:-top-16 sm:size-32"
  >
    <span class="text-xl font-bold sm:text-2xl">{{ badge() }}</span>
  </div>
}
@switch (headingVariant()) {
  @case ("tag") {
    <h3
      class="mb-4 text-center font-mono text-xl text-emerald-400 sm:text-2xl"
      [class]="badge() ? 'mt-13.5 sm:mt-16' : 'mt-2'"
    >
      <span>&lt;</span>
      <span class="font-light text-white">{{ heading() }}</span>
      <span>&gt;</span>
    </h3>
  }
  @case ("bold") {
    <h3
      class="mb-4 px-4 text-2xl font-bold text-emerald-400"
      [class]="badge() ? 'mt-10 sm:mt-12' : 'mt-2'"
    >
      {{ heading() }}
    </h3>
  }
}
<p class="grow text-left text-sm text-white px-4 sm:text-base">
  <ng-content />
</p>
@if (actionIcon(); as icon) {
  <div class="mt-4 flex justify-end">
    <sc-button
      variant="outline"
      size="small"
      [icon]="icon"
      [ariaLabel]="actionLabel() ?? null"
      [routerLink]="actionLink()"
      [attr.id]="actionId() ?? null"
      (buttonClick)="actionClick.emit()"
    ></sc-button>
  </div>
}
