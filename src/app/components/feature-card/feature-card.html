@if (badge()) {
  <div
    class="absolute -top-16 left-1/2 flex size-32 -translate-x-1/2 items-center justify-center rounded-full bg-emerald-400"
  >
    <span class="text-2xl font-bold">{{ badge() }}</span>
  </div>
}
@switch (headingVariant()) {
  @case ("tag") {
    <h3
      class="mb-4 text-center font-mono text-2xl text-emerald-400"
      [class.mt-16]="badge()"
      [class.mt-2]="!badge()"
    >
      <span>&lt;</span>
      <span class="font-light text-white">{{ heading() }}</span>
      <span>&gt;</span>
    </h3>
  }
  @case ("bold") {
    <h3
      class="mb-4 text-2xl font-bold text-emerald-400"
      [class.mt-12]="badge()"
      [class.mt-2]="!badge()"
    >
      {{ heading() }}
    </h3>
  }
}
<p class="grow text-left text-base text-white px-4">
  <ng-content />
</p>
@if (actionIcon(); as icon) {
  <div class="mt-4 flex justify-end">
    <sc-button
      variant="outline"
      size="small"
      [icon]="icon"
      [ariaLabel]="actionLabel() ?? null"
      [routerLink]="actionLink()"
      [attr.id]="actionId() ?? null"
      (buttonClick)="actionClick.emit()"
    ></sc-button>
  </div>
}
