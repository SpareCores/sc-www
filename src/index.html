    <link rel="manifest" href="manifest.webmanifest" />

    <style>
      #sc-auth-pending-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 2147483646;
        display: none;
        background: #082f49;
      }
      html.sc-auth-pending #sc-auth-pending-overlay {
        display: block;
      }
      #sc-auth-pending-overlay .sc-auth-pending-overlay__content {
        position: absolute;
        top: 50%;
        left: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        text-align: center;
        transform: translate(-50%, -50%);
      }
      #sc-auth-pending-overlay .sc-auth-pending-overlay__text {
        margin: 0;
        color: #fff;
        font:
          1.125rem/1.75rem system-ui,
          sans-serif;
      }
      #sc-auth-pending-overlay .sc-auth-pending-spinner {
        box-sizing: border-box;
        width: 3rem;
        height: 3rem;
        border: 3px solid #e5e7eb;
        border-top-color: #34d399;
        border-radius: 50%;
        animation: sc-auth-pending-spin 0.8s linear infinite;
      }
      @keyframes sc-auth-pending-spin {
        to {
          transform: rotate(360deg);
        }
      }
      html.sc-auth-pending {
        overflow: hidden !important;
        scrollbar-gutter: stable;
      }
      html.sc-auth-pending,
      html.sc-auth-pending body {
        background: #082f49;
        overflow: hidden !important;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="sc-auth-pending-overlay"
      role="status"
      aria-live="polite"
      aria-hidden="true"
    >
      <div class="sc-auth-pending-overlay__content">
        <div class="sc-auth-pending-spinner" aria-hidden="true"></div>
        <p class="sc-auth-pending-overlay__text">
          Benchmarking your patience...
        </p>
      </div>
    </div>
    <script>
      try {
        if (sessionStorage.getItem("scAuthPending") === "1") {
          document.documentElement.classList.add("sc-auth-pending");
          document
            .getElementById("sc-auth-pending-overlay")
            ?.setAttribute("aria-hidden", "false");
        }
      } catch (e) {}
    </script>
    <sc-root></sc-root>
  </body>
