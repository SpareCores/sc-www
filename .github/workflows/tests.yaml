name: Tests
on: [push]

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Install modules
        run: npm install --include=dev
      - name: Run ESLint
        run: npm run lint
      - name: Run Prettier check
        run: npm run prettier:check

  unit-tests:
    needs: eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Install modules
        run: npm install --include=dev
      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2.1.1
      - name: Run Jasmine Karma tests
        run: npm run test:ci
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          NG_APP_BACKEND_BASE_URI: https://keeper.sparecores.net
          NG_APP_BACKEND_BASE_URI_SSR: https://keeper.sparecores.net
          NG_APP_WWW_API_BASE_URI: https://www-api-staging.sparecores.net
          NG_APP_CLERK_PUBLISHABLE_KEY: ""
          NG_APP_POSTHOG_KEY: ""
          NG_APP_POSTHOG_HOST: ""
          NG_APP_SENTRY_DSN: ""
          NG_APP_SENTRY_TRACE_SAMPLE_RATE: "0"
          NG_APP_SENTRY_PROFILE_SAMPLE_RATE: "0"
          NG_APP_SENTRY_ENVIRONMENT: "test"
          NG_APP_SENTRY_RELEASE: ""
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: unit-test-coverage
          path: coverage
          retention-days: 7
          if-no-files-found: ignore

  cypress-run:
    needs: unit-tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Inject legal docs
        env:
          LEGAL_TOKEN: ${{ secrets.LEGAL_TOKEN }}
          LEGAL_URL: ${{ secrets.LEGAL_URL }}
        run: 'curl -s -L -H "Authorization: token ${LEGAL_TOKEN}" ${LEGAL_URL} | tar xz --strip-components=1'
      - name: Cypress run
        uses: cypress-io/github-action@v7.1.9
        with:
          build: npm run prebuild
          start: npm start
          wait-on: "http://localhost:4200"
          browser: chrome
        env:
          CYPRESS_BASE_URL: http://localhost:4200
          NG_APP_BACKEND_BASE_URI: https://keeper.sparecores.net
          NG_APP_BACKEND_BASE_URI_SSR: https://keeper.sparecores.net
          NG_APP_WWW_API_BASE_URI: https://www-api-staging.sparecores.net
          NG_APP_CLERK_PUBLISHABLE_KEY: ""
          NG_APP_POSTHOG_KEY: ""
          NG_APP_POSTHOG_HOST: ""
          NG_APP_SENTRY_DSN: ""
          NG_APP_SENTRY_TRACE_SAMPLE_RATE: "0"
          NG_APP_SENTRY_PROFILE_SAMPLE_RATE: "0"
          NG_APP_SENTRY_ENVIRONMENT: "test"
          NG_APP_SENTRY_RELEASE: ""
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: cypress-screenshots
          path: |
            cypress/screenshots
            cypress-image-diff-screenshots
            cypress-image-diff-html-report
          retention-days: 7
          if-no-files-found: ignore
      - name: Diff visual regression tests against main baselines
        if: always() && github.ref != 'refs/heads/main'
        run: |
          git fetch --depth=1 origin main
          mkdir -p .visual-diff-vs-main/baseline
          git archive FETCH_HEAD cypress-image-diff-screenshots/baseline \
            | tar -x --strip-components=2 -C .visual-diff-vs-main/baseline
          node visual-diff-vs-baseline.js \
            .visual-diff-vs-main/baseline \
            cypress-image-diff-screenshots/comparison \
            .visual-diff-vs-main/diff
      - uses: actions/upload-artifact@v7.0.1
        if: always() && github.ref != 'refs/heads/main'
        with:
          name: visual-regression-vs-main
          path: .visual-diff-vs-main/diff
          retention-days: 7
          if-no-files-found: ignore
