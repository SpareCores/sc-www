name: Tests
on: [push]

concurrency:
  group: tests-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eslint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - name: Install modules
        run: npm ci --no-audit --no-fund
        env:
          CYPRESS_INSTALL_BINARY: 0
      - name: Run ESLint
        run: npm run lint
      - name: Run Prettier check
        run: npm run prettier:check

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - name: Install modules
        run: npm ci --no-audit --no-fund
        env:
          CYPRESS_INSTALL_BINARY: 0
      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2.1.1
      - name: Run Jasmine Karma tests
        run: npm run test:ci
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          NG_APP_BACKEND_BASE_URI: https://keeper.sparecores.net
          NG_APP_BACKEND_BASE_URI_SSR: https://keeper.sparecores.net
          NG_APP_WWW_API_BASE_URI: https://www-api-staging.sparecores.net
          NG_APP_CLERK_PUBLISHABLE_KEY: ""
          NG_APP_POSTHOG_KEY: ""
          NG_APP_POSTHOG_HOST: ""
          NG_APP_SENTRY_DSN: ""
          NG_APP_SENTRY_TRACE_SAMPLE_RATE: "0"
          NG_APP_SENTRY_PROFILE_SAMPLE_RATE: "0"
          NG_APP_SENTRY_ENVIRONMENT: "test"
          NG_APP_SENTRY_RELEASE: ""
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: unit-test-coverage
          path: coverage
          retention-days: 7
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - name: Inject legal docs
        env:
          LEGAL_TOKEN: ${{ secrets.LEGAL_TOKEN }}
          LEGAL_URL: ${{ secrets.LEGAL_URL }}
        run: |
          if [ -z "${LEGAL_TOKEN}" ] || [ -z "${LEGAL_URL}" ]; then
            echo "Legal docs secrets are not available, skipping."
            exit 0
          fi
          curl -s -L -H "Authorization: token ${LEGAL_TOKEN}" ${LEGAL_URL} | tar xz --strip-components=1
      - name: Install modules
        run: npm ci --no-audit --no-fund
        env:
          CYPRESS_INSTALL_BINARY: 0
      - name: Build SSR production bundle
        run: npm run build -- --source-map=false
        env:
          NG_APP_BACKEND_BASE_URI: https://keeper.sparecores.net
          NG_APP_BACKEND_BASE_URI_SSR: https://keeper.sparecores.net
          NG_APP_WWW_API_BASE_URI: https://www-api-staging.sparecores.net
          NG_APP_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY_TESTING }}
          NG_APP_POSTHOG_KEY: ""
          NG_APP_POSTHOG_HOST: ""
          NG_APP_SENTRY_DSN: ""
          NG_APP_SENTRY_TRACE_SAMPLE_RATE: "0"
          NG_APP_SENTRY_PROFILE_SAMPLE_RATE: "0"
          NG_APP_SENTRY_ENVIRONMENT: "test"
          NG_APP_SENTRY_RELEASE: ""
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ssr-dist
          path: dist
          retention-days: 7
          if-no-files-found: error

  cypress-shard:
    name: cypress-shard (${{ matrix.shard }})
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: visual-desktop
            spec: cypress/e2e/visual/desktop/**
          - shard: visual-mobile
            spec: cypress/e2e/visual/mobile/**
          - shard: visual-tablet
            spec: cypress/e2e/visual/tablet/**
          - shard: functional-auth-http
            spec: cypress/e2e/functional/auth/**,cypress/e2e/functional/http/**
          - shard: functional-pages
            spec: cypress/e2e/functional/pages/**
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - uses: actions/download-artifact@v7.0.0
        with:
          name: ssr-dist
          path: dist
      - name: Move browser assets to the SSR static folder
        run: mv dist/sc-www/browser dist/sc-www/server/static
      - name: Cypress run
        uses: cypress-io/github-action@v7.4.6
        with:
          start: npm run serve:ssr:sc-www
          wait-on: "http://localhost:4200"
          browser: chrome
          spec: ${{ matrix.spec }}
        env:
          PORT: 4200
          NG_APP_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY_TESTING }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY_TESTING }}
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: cypress-shard-${{ matrix.shard }}
          path: |
            cypress/screenshots
            cypress-image-diff-screenshots/comparison
            cypress-image-diff-screenshots/diff
          retention-days: 7
          if-no-files-found: ignore

  cypress-run:
    needs: cypress-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Check for baseline changes against main
        id: baselines
        if: github.ref != 'refs/heads/main'
        run: |
          git fetch --depth=1 origin main
          if git diff --quiet FETCH_HEAD -- cypress-image-diff-screenshots/baseline; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v7.0.0
        with:
          pattern: cypress-shard-*
          merge-multiple: true
      - name: Collect failed and new screenshots
        run: |
          src=cypress-image-diff-screenshots
          out=cypress-screenshots-artifact
          mkdir -p "$out"
          if [ -d cypress/screenshots ]; then
            cp -R cypress/screenshots "$out/screenshots"
          fi
          for diff in "$src"/diff/*.png; do
            [ -e "$diff" ] || continue
            name=$(basename "$diff")
            for dir in baseline comparison diff; do
              if [ -f "$src/$dir/$name" ]; then
                mkdir -p "$out/$dir"
                cp "$src/$dir/$name" "$out/$dir/"
              fi
            done
          done
          for comparison in "$src"/comparison/*.png; do
            [ -e "$comparison" ] || continue
            name=$(basename "$comparison")
            if [ ! -f "$src/baseline/$name" ]; then
              mkdir -p "$out/new"
              cp "$comparison" "$out/new/"
            fi
          done
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cypress-screenshots
          path: cypress-screenshots-artifact
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true
      - uses: actions/setup-node@v7.1.0
        if: steps.baselines.outputs.changed == 'true'
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - name: Install modules
        if: steps.baselines.outputs.changed == 'true'
        run: npm ci --no-audit --no-fund
        env:
          CYPRESS_INSTALL_BINARY: 0
      - name: Diff visual regression tests against main baselines
        if: steps.baselines.outputs.changed == 'true'
        run: |
          mkdir -p .visual-diff-vs-main/baseline
          git archive FETCH_HEAD cypress-image-diff-screenshots/baseline \
            | tar -x --strip-components=2 -C .visual-diff-vs-main/baseline
          node .github/scripts/visual-diff-vs-baseline.js \
            .visual-diff-vs-main/baseline \
            cypress-image-diff-screenshots/comparison \
            .visual-diff-vs-main/diff
      - uses: actions/upload-artifact@v7.0.1
        if: steps.baselines.outputs.changed == 'true'
        with:
          name: visual-regression-vs-main
          path: .visual-diff-vs-main/diff
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true
      - name: Delete intermediate artifacts
        if: needs.cypress-shard.result == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[]
              | select(.name | test("^(ssr-dist|cypress-shard-.+)$"))
              | .id' \
            | xargs -r -I{} gh api -X DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/{}"
      - name: Check that every Cypress shard passed
        run: test "${{ needs.cypress-shard.result }}" = "success"
